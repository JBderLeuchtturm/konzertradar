name: Konzerte aktualisieren

# Jeden Morgen: Geschmack von stats.fm holen, Konzerte bei Ticketmaster suchen,
# Seite neu veroeffentlichen und bei neuen Konzerten ein Issue anlegen
# (das kommt als Mail bzw. Push in der GitHub-App an).
#
# Einmalig noetig:
#   - Settings -> Secrets and variables -> Actions: Secret TICKETMASTER_KEY
#   - Settings -> Pages -> Source: "GitHub Actions"

on:
  schedule:
    - cron: '23 4 * * *' # taeglich 5:23 Uhr (Winterzeit) bzw. 6:23 Uhr (Sommerzeit)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
  actions: write

concurrency:
  group: konzertradar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Konzerte suchen
        env:
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/update.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # GitHub schaltet Zeitplaene in Repos ohne Aktivitaet nach 60 Tagen ab.
      # Das erneute Einschalten setzt die Frist zurueck.
      - name: Zeitplan wach halten
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
